[project]
name = "teamup-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "pymysql[rsa]>=1.1,<2", "alembic>=1.13,<2", "python-dotenv>=1,<2", "itsdangerous>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.8,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
